[project]
name = "litigious-seller"
version = "0.1.0"
description = "Demo x402 seller used to exercise BillGuard's buyer protections"
requires-python = ">=3.11"
dependencies = [
    "x402[httpx,evm,fastapi]==2.25.0",
    "eth-account>=0.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
